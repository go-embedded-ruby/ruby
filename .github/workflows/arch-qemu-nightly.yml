name: arch-qemu-nightly

# Scheduled QEMU validation of the four EXOTIC 64-bit targets that GitHub-hosted
# runners cannot run natively: riscv64, loong64, ppc64le, s390x.
#
# These lanes used to run on every PR/push, where qemu-user emulation (~50-100x
# slower than native) was the CI bottleneck (~10 min/lane). They have been moved
# off the per-PR critical path: amd64 + arm64 gate merges natively in ci.yml, and
# because rbgo is pure-Go (CGO=0, no hand-written assembly) arch-specific risk is
# low. This nightly job preserves the exotic-arch coverage as an immediate
# fallback, and stays green even before the real-hardware secrets in
# native-arch.yml are configured. Once real-HW validation is active, this remains
# a cheap emulated safety net.
#
# Triggers: nightly schedule + manual dispatch ONLY — never on pull_request/push.

on:
  schedule:
    # 03:17 UTC daily (off-peak; odd minute to avoid the top-of-hour stampede).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arch-qemu-nightly
  cancel-in-progress: true

jobs:
  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      # This has not hung here. It hung in go-crdt/crdt, on the same runner
      # image and the same one-line install, for the better part of an hour and
      # more than once — and bounding it is what identified the culprit: three
      # attempts of ten minutes each produced not one line of output from
      # apt-get update, while the install itself was never reached. The cure is
      # copied rather than waited for, because a lane that runs once a night
      # and takes forty minutes has no spare hour to lose to apt.
      #
      # The runner image already ships apt's package lists, so the install
      # usually needs no refresh at all. It is tried on the lists that are there
      # first, and they are only refreshed if that was not enough. apt is also
      # told to give up on a stuck mirror rather than sit on it, which is what
      # made the outer timeout the only thing stopping it.
      - name: Install qemu-user-static
        run: |
          apt=(-y -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          if timeout 240 sudo apt-get install "${apt[@]}" qemu-user-static; then
            exit 0
          fi
          for attempt in 1 2; do
            echo "::warning::the runner's package lists were not enough; refreshing them (attempt $attempt)"
            timeout 240 sudo apt-get update "${apt[@]}" || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock*
            sudo dpkg --configure -a || true
            if timeout 240 sudo apt-get install "${apt[@]}" qemu-user-static; then
              exit 0
            fi
          done
          echo "::error::qemu-user-static could not be installed"
          exit 1
      - name: Test under qemu (${{ matrix.goarch }})
        # qemu-user emulation is ~50-100x slower than native, so the wall here is
        # not a hang detector: it is the only thing that decides whether a
        # slow-but-correct run counts. It has to sit well clear of what the run
        # actually takes, and 30m did not. Measured on internal/vm, the heaviest
        # package, in run 32661057000 (all four green):
        #
        #     loong64   990s      riscv64  1204s
        #     ppc64le  1284s      s390x    1754s   <- 46s under a 1800s wall
        #
        # The very next run of the same tree died at 1801.594s with
        # "panic: test timed out after 30m0s" and no failing test — a 2.6%
        # margin, which ordinary runner variance crosses. 60m puts s390x at
        # about half the wall, which is what "generous headroom" was meant to
        # say. (On real s390x silicon the same suite runs natively in seconds.)
        run: GOARCH=${{ matrix.goarch }} go test -timeout=60m -exec=${{ matrix.qemu }} ./...
