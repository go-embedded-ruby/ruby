name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Track the latest stable Go (org convention). go.mod floor is 1.26.4.
jobs:
  # Build, vet, race-test, and enforce 100% coverage. The interpreter is
  # ordinary architecture-independent Go; the `internal/ast` package is excluded
  # from the gate because it holds only statement-free interface witnesses
  # (empty marker methods, which the cover tool cannot attribute). The full suite
  # runs under -race on all three OS lanes, but the 100% coverage gate is enforced
  # on the POSIX lanes (ubuntu, macOS) only: windows cannot execute a few POSIX-only
  # paths (e.g. the "/dev/null" character device), so its coverage is structurally
  # below 100% — see the gate step below.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          COVERPKG=$(go list ./internal/... | paste -sd, -)
          # -race roughly doubles wall-clock, and the windows runner is the slowest
          # of the three OS lanes; the growing vm suite tips it past go test's 10m
          # default. macOS/ubuntu finish ~20m; windows runs ~2x so needs more room.
          # Bumped 30m->50m (Puppet ecosystem wave), then 50m->90m: the windows
          # binary hit the 50m alarm at 3007s with the running test at 0s — the
          # budget ran out, nothing hung — and each conformance wave adds to it.
          go test -timeout=90m -race -coverpkg="$COVERPKG" -coverprofile=cover.out ./...
          echo "--- functions below 100% (empty = all covered) ---"
          go tool cover -func=cover.out | grep -vE '100\.0%$' || true
          echo "---------------------------------------------------"
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          # The 100% gate is enforced on the POSIX lanes (ubuntu, macOS) only.
          # Windows cannot execute a handful of POSIX-only code paths — e.g. opening
          # "/dev/null" as a character device — so its measured coverage is
          # structurally below 100%. The suite still RUNS in full under -race on
          # windows to catch real, platform-specific failures (only coverage is not
          # gated there).
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "coverage gate not enforced on windows (POSIX-only paths unreachable)"
          else
            awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
              echo "::error::coverage ${cov}% < 100%"; exit 1; }
          fi

  # Per-PR arch gate: the two GitHub-hosted NATIVE targets only. amd64 and arm64
  # both have real runners, so these lanes stay fast and block merges. rbgo is
  # pure-Go (CGO=0) with no hand-written assembly, so arch-specific risk is low
  # and native amd64+arm64 catches virtually all bugs. The four exotic 64-bit
  # targets (riscv64/loong64/ppc64le/s390x) are NOT emulated on every PR anymore:
  #   - a scheduled nightly QEMU run keeps their coverage green
  #     (.github/workflows/arch-qemu-nightly.yml), and
  #   - scheduled real-hardware validation runs the suite natively on the GCC
  #     Compile Farm + a LinuxONE s390x host (.github/workflows/native-arch.yml).
  # This removes the ~10 min/lane QEMU bottleneck from the per-PR critical path.
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,     label: amd64 }
          - { os: ubuntu-24.04-arm,  label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go env GOARCH && go test ./...

  # WebAssembly (WASI preview 1) gate: the same interpreter compiled for
  # GOOS=wasip1 GOARCH=wasm and RUN under a real wasm runtime. The database /
  # search / KV / heavy-network gem backends are compiled out on wasm (their
  # files carry //go:build !wasm) and degrade to a clean error at require /
  # first-use, so this lane proves the VM + core stdlib build and execute in a
  # libc-free, socket-less sandbox. wazero is a pure-Go runtime, wired in as the
  # toolchain's WASI exec wrapper so `go build` + a real run both stay hermetic.
  wasm-wasip1:
    name: wasm (wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go version
      - name: Build rbgo.wasm (CGO=0, GOOS=wasip1)
        run: CGO_ENABLED=0 GOOS=wasip1 GOARCH=wasm go build -o rbgo.wasm ./cmd/rbgo
      - name: Install wazero (pure-Go wasm runtime)
        run: go install github.com/tetratelabs/wazero/cmd/wazero@latest
      - name: Run a Ruby snippet under wazero
        run: |
          out=$("$(go env GOPATH)/bin/wazero" run rbgo.wasm -e 'puts (1..10).sum')
          echo "rbgo.wasm output: $out"
          test "$out" = "55" || { echo "::error::expected 55, got '$out'"; exit 1; }
      - name: Vet + filestat coverage test under wasip1 (wazero exec wrapper)
        env:
          GOWASIRUNTIME: wazero
        run: |
          GOOS=wasip1 GOARCH=wasm go vet ./cmd/rbgo ./internal/vm
          # Two things run as a wasm binary under wazero: the wasm build-tagged
          # statSys (internal/vm/filestat_wasm.go), and the end-to-end claim that
          # a program with an observable effect has one. The build steps above
          # prove the module links; only this proves it interprets.
          GOOS=wasip1 GOARCH=wasm go test -c -o vm.test.wasm ./internal/vm
          "$(go env GOPATH)/bin/wazero" run -mount=/tmp:/tmp -env TMPDIR=/tmp \
            vm.test.wasm -test.run 'TestStatSysExtract|TestRunsAProgramOnThisHost' -test.v

  # WebAssembly (BROWSER) gate: GOOS=js GOARCH=wasm, the target behind the
  # playground (cmd/wasm + web/) and `rbgo build --closed --target wasm`.
  #
  # It is a SEPARATE target from the wasip1 lane above, not a variation of it, and
  # that is the whole reason this lane exists. GOOS=js and GOOS=wasip1 have
  # different syscall packages: js/wasm has no ENOTRECOVERABLE, EOWNERDEAD or
  # ETXTBSY, so internal/vm stopped compiling for the browser for three days
  # (#629 -> #682) while the wasip1 lane above stayed green the entire time. One
  # wasm lane is not wasm coverage.
  #
  # The lane does not stop at the compiler either. It loads the module into node
  # with Go's own lib/wasm/wasm_exec.js — the same glue web/index.html loads — and
  # asserts Ruby ran: see web/smoke.mjs. Measured on an M-series host with a cold
  # GOCACHE, so these are build-from-scratch numbers, not warm ones: build ./...
  # 14s, vet 18s, the module 97 MB, the node run a few seconds. This lane has not
  # yet had a runner of its own to time, so treat the sibling `wasm (wasip1)` lane
  # as the scale to expect: 2.0 min end to end on ubuntu-latest, and it does strictly
  # more (it also installs wazero and runs a test binary). Nothing here is
  # -race-priced and the lane runs in parallel with the others.
  wasm-js:
    name: wasm (js, browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: go version && node --version
      # ./... and not just ./cmd/wasm: #682 was in internal/vm, a package the
      # playground reaches only transitively, and the breakage was three names in
      # a table no browser-specific file mentions.
      - name: Build everything for js/wasm (the #682 regression)
        run: CGO_ENABLED=0 GOOS=js GOARCH=wasm go build ./...
      - name: Vet the js/wasm packages
        run: CGO_ENABLED=0 GOOS=js GOARCH=wasm go vet ./cmd/wasm ./cmd/rbgo ./internal/vm
      - name: Build the playground module
        run: CGO_ENABLED=0 GOOS=js GOARCH=wasm go build -o web/rbgo.wasm ./cmd/wasm
      - name: Run Ruby in a real JS host (node + Go's wasm_exec.js)
        run: node web/smoke.mjs web/rbgo.wasm

  # The RBGO_BUILD_IT lane. Three integration tests in cmd/rbgo drive `rbgo build`
  # end to end — native, --closed, and --closed --target wasm — and every one of
  # them was behind `if os.Getenv("RBGO_BUILD_IT") == ""` with no workflow anywhere
  # in this repo setting it. TestClosedWasmBuildIntegration fails on the #682
  # regression with exactly its three errors: the guard was correct, complete, and
  # unreachable for three days.
  #
  # The choice made here is to WIRE IT IN rather than delete the claim, because the
  # three tests cover what no other lane does: the nested `go build` the rbgo
  # command performs, that --closed really drops the front-end from the binary, and
  # that a baked program runs. The cost is what makes it its own lane rather than a
  # step in `test`: these are full cross-compiles of a ~97 MB module, 35s cold for
  # all three on an M-series host (they share the build cache, so the third is
  # nearly free) and MEASURED ON A RUNNER at 141s of test time, 5.3 min for the
  # whole job. That is the honest frame: it lands BETWEEN two lanes this file
  # already pays for — `arch arm64` at 5.9 min and `arch amd64` at 9.4 min on the
  # same commit — and well under the 20-90 min -race coverage lane. Keeping it in
  # its own lane is about staying off that lane's critical path, not about price.
  #
  # node is installed because TestClosedWasmBuildIntegration now RUNS the module it
  # builds, and it fails rather than skips if node is missing. A gate that steps
  # aside when a dependency is absent is the failure this lane exists to correct.
  #
  # THIS LANE IS RED ON ARRIVAL, and that is the finding, not a mistake. Turning the
  # env var on is what a gate nobody ran was hiding: both closed-world tests fail
  # their "the front-end must not be linked" assertion, on this branch and equally
  # on the commit it branched from. `rbgo build --closed` prints "closed-world —
  # front-end dropped (no lexer/parser/compiler linked)" and then ships a 172.9 MiB
  # binary carrying 255 github.com/go-ruby-parser/parser.(*Parser).* text symbols.
  # The cause is a single edge: internal/vm/rubocop.go and rubocop_bind.go have NO
  # build tags, and github.com/go-ruby-rubocop/rubocop imports the parser, so the
  # front-end re-enters the closed dep graph through the RuboCop binding
  # (`go list -deps -tags rbgo_closed ./cmd/rbgo` shows it).
  #
  # Confirmed on a GitHub ubuntu runner, not only locally, and it fails for EXACTLY
  # that one reason: TestBuildIntegration, TestBuildEnv and
  # TestRunSendsWarningsToTheRealStderr pass, and the only lines in the failure are
  # the two "still links the front-end" assertions. The node run of the closed wasm
  # module and both of its JS.log assertions pass there too, so the leak is
  # platform-independent and nothing else in the lane is broken.
  #
  # The fix is deliberately NOT in this PR: it is a scope decision about what
  # --closed supports (does a closed-world build still answer `require "rubocop"`,
  # or degrade to a LoadError the way the network backends do on wasm?), and it
  # touches internal/vm, not this cluster. Neither assertion was weakened to get a
  # green tick -- the whole point of the exercise was that a check nobody runs is
  # documentation.
  build-integration:
    name: rbgo build integration (RBGO_BUILD_IT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: go version && node --version
      - name: go test ./cmd/rbgo with the integration tests enabled
        env:
          RBGO_BUILD_IT: '1'
        run: go test -count=1 -timeout=30m -v ./cmd/rbgo
