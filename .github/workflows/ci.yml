name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Track the latest stable Go (org convention). go.mod floor is 1.26.4.
jobs:
  # Build, vet, race-test, and enforce 100% coverage. The interpreter is
  # ordinary architecture-independent Go; the `internal/ast` package is excluded
  # from the gate because it holds only statement-free interface witnesses
  # (empty marker methods, which the cover tool cannot attribute).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          COVERPKG=$(go list ./internal/... | paste -sd, -)
          # -race roughly doubles wall-clock, and the windows runner is the slowest
          # of the three OS lanes; the growing vm suite tips it past go test's 10m
          # default. macOS/ubuntu finish ~20m; windows runs ~2x so needs more room.
          # Bumped 30m->50m as the vm binding set keeps growing (Puppet ecosystem wave).
          go test -timeout=50m -race -coverpkg="$COVERPKG" -coverprofile=cover.out ./...
          echo "--- functions below 100% (empty = all covered) ---"
          go tool cover -func=cover.out | grep -vE '100\.0%$' || true
          echo "---------------------------------------------------"
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  # Per-PR arch gate: the two GitHub-hosted NATIVE targets only. amd64 and arm64
  # both have real runners, so these lanes stay fast and block merges. rbgo is
  # pure-Go (CGO=0) with no hand-written assembly, so arch-specific risk is low
  # and native amd64+arm64 catches virtually all bugs. The four exotic 64-bit
  # targets (riscv64/loong64/ppc64le/s390x) are NOT emulated on every PR anymore:
  #   - a scheduled nightly QEMU run keeps their coverage green
  #     (.github/workflows/arch-qemu-nightly.yml), and
  #   - scheduled real-hardware validation runs the suite natively on the GCC
  #     Compile Farm + a LinuxONE s390x host (.github/workflows/native-arch.yml).
  # This removes the ~10 min/lane QEMU bottleneck from the per-PR critical path.
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,     label: amd64 }
          - { os: ubuntu-24.04-arm,  label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go env GOARCH && go test ./...
