name: rubyspec-ratchet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Shrink-only ruby/spec conformance gate: run the language + core suites through
# rbgo and judge the sweep FILE BY FILE against scripts/conformance/rubyspec/BASELINE.
# The run fails if any spec file passes fewer examples than its record, or stops
# loading. rbgo's language conformance is thereby tracked and can only go up —
# see scripts/conformance/rubyspec/README.md for why a per-file record replaced
# the single frozen total it used to gate on.
#
# The sweep itself — the pinned image, the Go version, the raised TIMEOUT, the
# memory watcher — lives in rubyspec-sweep.yml, which rubyspec-baseline.yml also
# calls to RE-RECORD the baseline. One definition, two callers: what records the
# baseline and what enforces it are the same machine by construction, and not by
# two files that have to be kept agreeing.
jobs:
  ratchet:
    uses: ./.github/workflows/rubyspec-sweep.yml
